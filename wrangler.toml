# Cloudflare Workers + D1 deployment. Nothing is deployed until you run `npx wrangler deploy`.
name = "quiet-list"
main = "server/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true          # every request passes through the server so its security headers apply

[[d1_databases]]
binding = "DB"
database_name = "quiet-list"
database_id = "00000000-0000-0000-0000-000000000000"   # replace with the id printed by `npx wrangler d1 create quiet-list`
migrations_dir = "server/migrations"
